---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
      # Lab 4 uses these. The 'kubernetes-pods' scrape job keeps any pod
      # carrying prometheus.io/scrape="true" and rewrites the target port.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.1.0
          ports:
            - containerPort: 3000
              name: http-grafana
          env:
            # Plain text on purpose so the lab is self-contained.
            # Lab 9 covers moving these into a Secret.
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin123
            - name: GF_USERS_DEFAULT_THEME
              value: dark
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: provisioning-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: provisioning-dashboards
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-files
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: grafana-storage
          emptyDir: {}
        # optional: true means these mount empty until Lab 9 creates the
        # ConfigMaps. Grafana starts fine either way.
        - name: provisioning-datasources
          configMap:
            name: grafana-provisioning-datasources
            optional: true
        - name: provisioning-dashboards
          configMap:
            name: grafana-provisioning-dashboards
            optional: true
        - name: dashboard-files
          configMap:
            name: grafana-dashboard-files
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: NodePort   # NodePort for minikube. Use Ingress in a real cluster.
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
