---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: logging
  labels:
    app: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:9.4.2
          env:
            - name: ELASTICSEARCH_HOSTS
              value: http://elasticsearch.logging.svc.cluster.local:9200
            # REQUIRED for Lab 5. Without this key Kibana generates a random
            # one at startup and BLOCKS the entire alerting and connector API.
            # Must be 32+ characters. Note the env var form: Kibana ignores
            # the dotted name when passed as an environment variable.
            - name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
              value: "lab-encryption-key-change-me-0123456789abcdef"
            - name: XPACK_REPORTING_ENCRYPTIONKEY
              value: "lab-reporting-key-change-me-0123456789abcdef"
            - name: XPACK_SECURITY_ENCRYPTIONKEY
              value: "lab-security-key-change-me-0123456789abcdef"
          ports:
            - containerPort: 5601
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: logging
  labels:
    app: kibana
spec:
  type: NodePort
  selector:
    app: kibana
  ports:
    - name: http
      port: 5601
      targetPort: 5601
